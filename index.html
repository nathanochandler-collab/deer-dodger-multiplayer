<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deer Dodge Multiplayer</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    margin: 0;
    background: #222;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    margin: auto;
    background: #5b9e45;
    touch-action: none;
}

#ui {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
    z-index: 10;
    text-align: center;
    white-space: nowrap;
}

#room,
#status {
    font-size: 14px;
    margin-top: 3px;
}

#lobby {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.84);
    z-index: 30;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

#lobbyBox {
    background: #333;
    padding: 28px;
    border-radius: 16px;
    width: min(90%, 380px);
}

#lobby h1 {
    margin-top: 0;
}

input,
button {
    font: inherit;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    margin: 5px;
}

input {
    width: 85%;
    text-align: center;
    text-transform: uppercase;
}

button {
    cursor: pointer;
    padding: 12px 18px;
}

#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.65);
    color: white;
    z-index: 20;
    text-align: center;
}

#gameOver h1 {
    font-size: 50px;
    margin: 10px;
}

#gameOver p {
    font-size: 22px;
}
</style>
</head>

<body>

<div id="ui">

    You:
    <span id="score">0</span>

    |

    Opponent:
    <span id="opponentScore">0</span>

    <div id="room"></div>

    <div id="status">
        Connecting...
    </div>

</div>


<div id="lobby">

    <div id="lobbyBox">

        <h1>🦌 Deer Dodge</h1>

        <p>
            Create a room or join a friend's room.
        </p>

        <button onclick="createRoom()">
            Create Room
        </button>

        <br>

        <input
            id="roomInput"
            maxlength="6"
            placeholder="ROOM CODE"
        >

        <button onclick="joinRoom()">
            Join Room
        </button>

        <p id="lobbyMessage"></p>

    </div>

</div>


<div id="gameOver">

    <h1>
        GAME OVER
    </h1>

    <p>
        Your score:
        <span id="finalScore">0</span>
    </p>

    <p>
        Opponent:
        <span id="finalOpponentScore">0</span>
    </p>

    <button onclick="location.reload()">
        Back to Lobby
    </button>

</div>


<canvas id="game"></canvas>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

canvas.width = 500;
canvas.height = 800;


/* =========================
   MULTIPLAYER
========================= */

let ws = null;

let roomCode = "";

let playerId = "";

let gameStarted = false;


function connect() {

    const protocol =
        location.protocol === "https:"
        ? "wss"
        : "ws";

    ws = new WebSocket(
        `${protocol}://${location.host}`
    );


    ws.onopen = function() {

        statusText("Connected");

    };


    ws.onclose = function() {

        statusText("Disconnected");

    };


    ws.onerror = function() {

        statusText("Connection error");

    };


    ws.onmessage = function(event) {

        const msg =
            JSON.parse(event.data);


        /* ROOM CREATED */

        if (msg.type === "roomCreated") {

            roomCode = msg.room;

            playerId = msg.playerId;

            showRoom(msg.players);

        }


        /* JOINED ROOM */

        if (msg.type === "joined") {

            roomCode = msg.room;

            playerId = msg.playerId;

            showRoom(msg.players);

        }


        /* OTHER PLAYER JOINED */

        if (msg.type === "playerJoined") {

            statusText(
                "2 players connected!"
            );

            startGame();

        }


        /* GAME STATE */

        if (msg.type === "state") {

            if (
                msg.playerId &&
                msg.playerId !== playerId
            ) {

                opponent.x =
                    msg.x;

                opponent.alive =
                    msg.alive;

                opponentScore =
                    msg.score;

            }


            if (msg.deer) {

                deer =
                    msg.deer;

            }


            if (msg.gameStarted) {

                startGame();

            }

        }


        /* YOUR SCORE */

        if (msg.type === "selfScore") {

            lastServerScore =
                msg.score;

            score =
                msg.score;

            document
                .getElementById("score")
                .textContent =
                Math.floor(score);

        }


        /* GAME OVER */

        if (msg.type === "gameOver") {

            gameRunning = false;

            opponent.alive = false;

            showGameOver();

        }


        /* SERVER ERROR */

        if (msg.type === "error") {

            document
                .getElementById("lobbyMessage")
                .textContent =
                msg.message;

        }

    };

}


/* =========================
   SEND DATA
========================= */

function send(data) {

    if (
        ws &&
        ws.readyState === WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

    }

}


/* =========================
   CREATE ROOM
========================= */

function createRoom() {

    send({
        type: "create"
    });

}


/* =========================
   JOIN ROOM
========================= */

function joinRoom() {

    const input =
        document.getElementById(
            "roomInput"
        );

    const code =
        input.value
            .trim()
            .toUpperCase();


    if (!code) {

        document
            .getElementById(
                "lobbyMessage"
            )
            .textContent =
            "Enter a room code.";

        return;

    }


    /* IMPORTANT:
       Send the actual code
       the player typed. */

    send({
        type: "join",
        room: code
    });

}


/* =========================
   ROOM DISPLAY
========================= */

function showRoom(players) {

    document
        .getElementById("room")
        .textContent =
        "Room: " + roomCode;


    document
        .getElementById("lobby")
        .style.display =
        "none";


    if (players === 1) {

        statusText(
            "Waiting for another player..."
        );

    }
    else {

        statusText(
            "2 players connected!"
        );

    }


    if (players >= 2) {

        startGame();

    }

}


/* =========================
   START GAME
========================= */

function startGame() {

    if (gameStarted) {

        return;

    }

    gameStarted = true;

    gameRunning = true;

}


/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let opponentScore = 0;

let gameRunning = true;

let roadSpeed = 5;

let deer = [];

let lastServerScore = 0;


const keys = {

    left: false,

    right: false

};


const car = {

    x: 228,

    y: 670,

    width: 44,

    height: 75,

    speed: 7,

    color: "#e63946"

};


const opponent = {

    x: 228,

    y: 230,

    width: 44,

    height: 75,

    alive: true

};


/* =========================
   STATUS
========================= */

function statusText(text) {

    document
        .getElementById("status")
        .textContent =
        text;

}


/* =========================
   DRAW ROAD
========================= */

function drawRoad() {

    ctx.fillStyle =
        "#5b9e45";

    ctx.fillRect(
        0,
        0,
        500,
        800
    );


    ctx.fillStyle =
        "#4a8738";


    for (
        let y = -20;
        y < 800;
        y += 45
    ) {

        ctx.fillRect(
            20,
            y,
            35,
            5
        );

        ctx.fillRect(
            440,
            y + 20,
            35,
            5
        );

    }


    ctx.fillStyle =
        "#555";

    ctx.fillRect(
        90,
        0,
        320,
        800
    );


    ctx.fillStyle =
        "#ddd";

    ctx.fillRect(
        85,
        0,
        5,
        800
    );

    ctx.fillRect(
        410,
        0,
        5,
        800
    );


    ctx.fillStyle =
        "#fff";


    const offset =
        (
            performance.now()
            / 16
            * roadSpeed
        ) % 120;


    for (
        let y = -100;
        y < 900;
        y += 120
    ) {

        ctx.fillRect(
            245,
            y + offset,
            10,
            60
        );

    }

}


/* =========================
   DRAW CAR
========================= */

function drawCar(carObject, color) {

    ctx.fillStyle =
        "rgba(0,0,0,0.3)";

    ctx.fillRect(
        carObject.x + 5,
        carObject.y + 6,
        carObject.width,
        carObject.height
    );


    ctx.fillStyle =
        color;

    ctx.fillRect(
        carObject.x,
        carObject.y,
        carObject.width,
        carObject.height
    );


    ctx.fillStyle =
        "#9bd7e5";

    ctx.fillRect(
        carObject.x + 7,
        carObject.y + 10,
        carObject.width - 14,
        20
    );


    ctx.fillRect(
        carObject.x + 7,
        carObject.y + 39,
        carObject.width - 14,
        15
    );


    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        carObject.x - 5,
        carObject.y + 10,
        7,
        18
    );

    ctx.fillRect(
        carObject.x +
        carObject.width - 2,
        carObject.y + 10,
        7,
        18
    );


    ctx.fillRect(
        carObject.x - 5,
        carObject.y + 50,
        7,
        18
    );

    ctx.fillRect(
        carObject.x +
        carObject.width - 2,
        carObject.y + 50,
        7,
        18
    );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(
        carObject.x + 5,
        carObject.y + 2,
        8,
        6
    );


    ctx.fillRect(
        carObject.x +
        carObject.width - 13,
        carObject.y + 2,
        8,
        6
    );

}


/* =========================
   DRAW DEER
========================= */

function drawDeer(d) {

    ctx.fillStyle =
        "rgba(0,0,0,0.25)";

    ctx.fillRect(
        d.x + 5,
        d.y + 33,
        45,
        7
    );


    ctx.fillStyle =
        "#8b5a2b";


    ctx.fillRect(
        d.x,
        d.y + 12,
        34,
        20
    );


    ctx.fillRect(
        d.x + 27,
        d.y + 4,
        10,
        18
    );


    ctx.fillRect(
        d.x + 32,
        d.y,
        18,
        17
    );


    ctx.fillRect(
        d.x + 5,
        d.y + 28,
        5,
        12
    );


    ctx.fillRect(
        d.x + 14,
        d.y + 28,
        5,
        12
    );


    ctx.fillRect(
        d.x + 27,
        d.y + 28,
        5,
        12
    );


    ctx.strokeStyle =
        "#5b3a1c";

    ctx.lineWidth = 3;

    ctx.beginPath();


    ctx.moveTo(
        d.x + 38,
        d.y + 5
    );

    ctx.lineTo(
        d.x + 34,
        d.y - 7
    );

    ctx.lineTo(
        d.x + 30,
        d.y - 12
    );


    ctx.moveTo(
        d.x + 39,
        d.y + 5
    );

    ctx.lineTo(
        d.x + 44,
        d.y - 6
    );

    ctx.lineTo(
        d.x + 49,
        d.y - 10
    );


    ctx.stroke();


    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        d.x + 45,
        d.y + 5,
        3,
        3
    );

}


/* =========================
   COLLISION
========================= */

function collision(a, b) {

    const padding = 7;


    return (

        a.x + padding <
        b.x + b.width &&

        a.x +
        a.width -
        padding >
        b.x &&

        a.y + padding <
        b.y + b.height &&

        a.y +
        a.height -
        padding >
        b.y

    );

}


/* =========================
   UPDATE
========================= */

function update() {

    if (
        !gameRunning ||
        !gameStarted
    ) {

        return;

    }


    if (keys.left) {

        car.x -= car.speed;

    }


    if (keys.right) {

        car.x += car.speed;

    }


    car.x =
        Math.max(
            95,
            Math.min(
                405 - car.width,
                car.x
            )
        );


    /* Check the server-controlled deer */

    for (const d of deer) {

        if (collision(car, d)) {

            send({

                type: "dead",

                score: score

            });


            gameRunning = false;

            showGameOver();

            return;

        }

    }


    score =
        Math.max(
            score,
            lastServerScore
        );


    document
        .getElementById("score")
        .textContent =
        Math.floor(score);


    document
        .getElementById("opponentScore")
        .textContent =
        Math.floor(opponentScore);


    send({

        type: "position",

        x: car.x,

        score: score,

        alive: true

    });

}


/* =========================
   GAME OVER
========================= */

function showGameOver() {

    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        Math.floor(score);


    document
        .getElementById(
            "finalOpponentScore"
        )
        .textContent =
        Math.floor(opponentScore);


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "flex";

}


/* =========================
   CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = true;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = true;

        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = false;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = false;

        }

    }
);


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
    "mousemove",
    function(e) {

        if (!gameRunning) {

            return;

        }


        const rect =
            canvas.getBoundingClientRect();


        car.x =
            e.clientX -
            rect.left -
            car.width / 2;


        car.x =
            Math.max(
                95,
                Math.min(
                    405 - car.width,
                    car.x
                )
            );

    }
);


/* =========================
   TOUCH
========================= */

canvas.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();


        if (!gameRunning) {

            return;

        }


        const rect =
            canvas.getBoundingClientRect();


        car.x =
            e.touches[0].clientX -
            rect.left -
            car.width / 2;


        car.x =
            Math.max(
                95,
                Math.min(
                    405 - car.width,
                    car.x
                )
            );

    },
    {
        passive: false
    }
);


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        500,
        800
    );


    drawRoad();


    for (const d of deer) {

        drawDeer(d);

    }


    if (opponent.alive) {

        drawCar(
            opponent,
            "#3498db"
        );

    }


    drawCar(
        car,
        car.color
    );


    update();


    requestAnimationFrame(
        gameLoop
    );

}


/* START */

connect();

gameLoop();

</script>

</body>
</html>
